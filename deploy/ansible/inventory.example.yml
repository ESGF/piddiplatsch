---
all:
  children:
    piddi:
      hosts:
        piddi-esgf.example.org:
          # Pin a release tag or immutable commit before deploying.
          piddi_install_spec: >-
            git+https://github.com/ESGF/piddiplatsch.git@<release-tag-or-commit>

          # Additional independently packaged plugins installed into this VM.
          piddi_plugin_packages: []

          # Add distribution packages needed for the selected install source.
          # Debian/Ubuntu Git installs commonly also need python3-venv and git.
          piddi_os_packages:
            - logrotate

          # The first run installs and validates without starting the service.
          piddi_enable_service: false

          # In real inventory, keep secrets in an ignored host_vars file or
          # encrypt that file with Ansible Vault.
          piddi_config_content: |
            [consumer]
            projects = ["cmip6", "cmip7"]
            topic = "ESGF-PUBLICATIONS"
            output_dir = "/var/lib/piddi"

            [logging]
            level = "WARNING"
            file = "/var/log/piddi/piddi.log"

            [stats]
            db_path = "/var/lib/piddi/piddi.db"

            [kafka]
            "bootstrap.servers" = "broker1.example.org:9093"
            "group.id" = "piddi-esgf"
