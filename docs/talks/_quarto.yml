project:
  type: default
  output-dir: _build
  render:
    - overview.qmd

format:
  revealjs:
    theme: [default, theme.scss]
    embed-resources: true
    width: 1600
    height: 900
    margin: 0.08
    slide-number: c/t
    slide-level: 2
    transition: none
    center: false
    controls: true
    progress: true
    history: true

execute:
  enabled: false
