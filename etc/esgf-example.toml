# ESGF site configuration: copy to custom.toml for a manual/local run.
# Replace placeholders with your ESGF and Handle service parameters.
# Keep real credentials out of version control.
#
# Ansible reads this same custom.toml and installs /etc/piddi/piddi.toml.
# It adds production output/log/database paths only when omitted here.
# Optional deploy/ansible/custom.yml contains deployment controls, not a second
# copy of application settings. See deploy/README.md.
# Omitted settings inherit packaged defaults; see docs/configuration.md.

[consumer]
# Same projects and shared publication topic as the Ansible deployment.
projects = ["cmip6", "cmip6plus", "cmip7", "cordex-cmip6"]
topic = "ESGF-PUBLICATIONS"

[catalog]
# One shared SQLite database at <output_dir>/piddi.db.
# Harvest caches all registered projects; consumer.projects selects what map reads.
enabled = true
backend = "sqlite"
kafka_commit_batch_size = 100
kafka_commit_interval_seconds = 1.0
# Keep predecessor links disabled during initial filling. Enable once ready,
# or use map --version-history for the next mapping run.
version_history = false
# Optional database directory; deployment otherwise uses /var/lib/piddi:
# directory = "/data/piddi"

[batch]
# Enable the Ansible sync timer when automatic Handle publication is intended.
# Map per project at 100 pending events or a 10-minute maximum wait.
trigger_items = 100
max_wait_seconds = 600
max_items = 2000
publish_workers = 4
publish_retries = 3
# directory = "/data/piddi/batches"

[disk]
enabled = true
warn_free_gib = 40
stop_free_gib = 20
check_interval_seconds = 10

[lookup]
# Version lookup adapters: local catalog by default; explicit alternative "stac".
# Map linking is controlled by catalog.version_history, not this enabled switch.
backend = "catalog"
enabled = false

[stac]
# Missing PATCH bases recover this service's current item, without applying the patch.
# Recovered items refresh on later events and harvest startup; failures stop harvest.
# Override base_url/timeout under [plugins.<name>.stac] for a different project host.
base_url = "https://discovery.east.esgf.io"
timeout = 10

[kafka]
# Copy the broker endpoint(s) supplied for your ESGF Kafka access.
"bootstrap.servers" = "broker1.example.org:9093"
# Copy your assigned base consumer group; keep it stable and unique per workflow.
# Catalog harvest uses <group.id>.harvest; clean rebuilds add a persisted generation.
"group.id" = "de.dkrz.test.20260907-01"
# ESGF Resource -> client.id
"client.id" = "YOUR_ESGF_RESOURCE"
# ESGF API key -> sasl.username; API secret -> sasl.password
"sasl.username" = "YOUR_ESGF_API_KEY"
"sasl.password" = "YOUR_ESGF_API_SECRET"

# Inherits security.protocol = "SASL_SSL" and sasl.mechanisms = "PLAIN".
# If your broker requires another mechanism, override it here:
# "sasl.mechanisms" = "SCRAM-SHA-512"
# If your broker uses a custom CA, also set:
# "ssl.ca.location" = "/path/to/ca.pem"
# Local Docker test Kafka uses tests/config.toml with PLAINTEXT instead.

[handles]
default = "production"

[handles.profiles.production]
server_url = "https://handle.example.org"
prefix = "21.YOUR_PREFIX"
username = "300:21.YOUR_PREFIX/YOUR_HANDLE_USERNAME"
password = "YOUR_HANDLE_PASSWORD"

# Do not add file links to dataset Handle records in this site example.
# Set max_parts = -1 for unlimited links, or a positive limit if needed.
[plugins.cmip6]
# Sync weight, 0-255; 0 disables sync. All projects default to 100.
priority = 100
max_parts = 0

[plugins.cordex-cmip6]
priority = 100
max_parts = 0

[plugins.cmip6plus]
priority = 100
# Mapping error limit for this project only. Default: 1; 0 also stops at the
# first error; -1 allows unlimited errors. Harvest is independently fail-fast.
# max_errors = 10000
max_parts = 0

[plugins.cmip7]
# Increase to e.g. 200 to favor CMIP7 at batch boundaries when work is eligible.
priority = 100
max_parts = 0
# Set true in custom.toml for affected projects to correct publisher dataset PIDs
# generated from dataset_id instead of versioned instance_id. Defaults to false.
force_dataset_pid = false

# Manual testing (publish writes to the configured Handle server):
# piddi harvest
# piddi map --project cmip6 --limit 100
# Inspect outputs/batches/cmip6/ready/<batch-id>/handles.jsonl and failures.jsonl.
# piddi publish --project cmip6
# See docs/deployment.md for automatic harvest and sync with Ansible.
