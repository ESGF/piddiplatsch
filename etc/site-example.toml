# Recommended starting point: only site-specific settings.
# Save as custom.toml or install as /etc/piddi/piddi.toml.
# Replace placeholders before use. Keep real credentials out of version control.
# All omitted settings inherit packaged defaults; see docs/configuration.md.

[consumer]
projects = ["cmip6"]
topic = "CMIP6"
output_dir = "outputs"

[kafka]
"bootstrap.servers" = "broker.example.org:9093"
"group.id" = "piddi-my-site"
# Inherits security.protocol = "SASL_SSL" and sasl.mechanisms = "PLAIN".
"client.id" = "YOUR_ESGF_RESOURCE"
"sasl.username" = "YOUR_KAFKA_USERNAME"
"sasl.password" = "REPLACE_ME"
# For other mechanisms or a custom CA, see etc/esgf-example.toml.
# For local test Kafka, set "security.protocol" = "PLAINTEXT" and use its port.

[handles]
default = "site"

[handles.profiles.site]
server_url = "https://handles.example.org"
prefix = "21.YOUR_PREFIX"
username = "YOUR_USERNAME"
password = "REPLACE_ME"

# Plain consume writes JSONL. Use consume --publish for immediate delivery.
