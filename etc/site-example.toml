# Recommended starting point: only site-specific settings.
# Save as custom.toml or install as /etc/piddi/piddi.toml.
# Replace placeholders before use. Keep real credentials out of version control.
# All omitted settings inherit packaged defaults; see docs/configuration.md.

[consumer]
projects = ["cmip6"]
topic = "CMIP6"
output_dir = "outputs"

[kafka]
"bootstrap.servers" = "broker.example.org:9092"
"group.id" = "piddi-my-site"
# For Kafka authentication/TLS options, see etc/esgf-example.toml.

[handles]
default = "site"

[handles.profiles.site]
server_url = "https://handles.example.org"
prefix = "21.YOUR_PREFIX"
username = "YOUR_USERNAME"
password = "REPLACE_ME"

# Plain consume writes JSONL. Use consume --publish for immediate delivery.
