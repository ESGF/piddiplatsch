site_name: Piddiplatsch
site_description: ESGF publication records and persistent identifiers
site_url: https://esgf.github.io/piddiplatsch/
repo_url: https://github.com/ESGF/piddiplatsch
edit_uri: edit/main/docs/

theme:
  name: mkdocs

# The slide HTML is added after MkDocs finishes, so it is not a source page.
validation:
  nav:
    not_found: info

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Kafka notes: README_kafka.md
  - Overview slides: talks/overview.html
  - Building the documentation: building.md

# Quarto builds the deck separately. Never copy its tools, caches, or sources
# into the public MkDocs site.
exclude_docs: |
  /talks/
  /GITHUB_TRANSFER_CHECKLIST.md
  /errors_dc_04.txt
