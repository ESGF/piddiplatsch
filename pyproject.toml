[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "piddiplatsch"
version = "2.2.1"
description = "A Kafka consumer for CMIP6+ records with Handle Service integration"
readme = "README.md"
authors = [
    { name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de" }
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "click",
    "confluent-kafka >=2.9.0",
    "pyhandle >=1.4.1",
    "rich >=13.0.0",
    "toml",
    "requests",
    "pydantic >=2.11",
    "python-dateutil",
    "tqdm",
    "humanize >=4.13",
    "millify",
    "jsonpatch >=1.33",
    "elasticsearch <9.0.0,>=8.0.0",
    "pystac >=1.8.0",
    "pystac-client >=0.9.0",
    "multiformats"
]

[project.urls]
Homepage = "https://github.com/ESGF/piddiplatsch"
Repository = "https://github.com/ESGF/piddiplatsch"
Issues = "https://github.com/ESGF/piddiplatsch/issues"
Changelog = "https://github.com/ESGF/piddiplatsch/blob/main/CHANGES.md"

[project.optional-dependencies]
dev = [
  "pip >=24.2.0",
  "flit >=3.9.0,<4.0",
  "ipython>=8.13.0",
  "flask",
  "pytest >=8.0.0",
  "pytest-cov >=6.0.0",
  "hypothesis >=6.140.2",
  "ruff >=0.14.0,<0.15.0",
  "twine >=4.0.0",
  "wheel >=0.40.0",
  "black >=26.0.0,<27.0",
  "isort >=7.0.0,<8.0.0",
  "pre-commit >=4.5.1,<5.0.0",
  "bump-my-version >=1.2.0",
]

[project.scripts]
piddi = "piddiplatsch.cli:cli"

[tool.flit.module]
name = "piddiplatsch"

[tool.ruff]
src = ["src"]
line-length = 150
exclude = [
  ".eggs",
  ".git",
  "build",
  "docs",
  "notebooks"
]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
preview = true
ignore = [
  "BLE001", # Do not catch blind exception: `Exception`
  "RUF100", # Unused blanket `noqa` directive
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "B904", # raise exceptions with `raise ... from err`
  "PERF203", # `try`-`except` within a loop incurs performance overhead
  "G004", # Logging statement uses f-string
  "S101", # Use of `assert` detected
  "S104", # Possible binding to all interfaces
  "S105", # Possible hardcoded password
  "S110", # `try`-`except`-`pass` detected, consider logging the exception
  "S112", # `try`-`except`-`continue` detected, consider logging the exception
  "S113", # Requests call without timeout (ignore for demo notebooks)
  "C408", # Unnecessary `dict()` call (rewrite as a literal)
  "C419", # Unnecessary list comprehension
]
select = [
  "BLE", # blind-except
  # "D", # docstrings
  "E", # pycodestyle errors
  "F", # pyflakes errors
  "RUF", # ruff checks
  "UP", # python version conventions
  "W", # pycodestyle warnings
  "B", # flake8-bugbear
  "N", # naming conventions
  "G", # logging-format
  "C", # complexity
  "PTH", # pathlib
  "FLY", # modernizing string formatting
  "PERF", # iterator performance
  "S", # bandit security
]
extend-select = [
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: Integration tests (uses JSONL backend, no Docker required)",
    "smoke: End-to-end tests (requires Docker services: Kafka and Handle server)",
  "plugin: Plugin tests (extensibility, discovery, and plugin logic)",
  "cmip6: CMIP6 plugin tests",
]
# Note: Tests without markers are considered unit tests (fast, no external dependencies)

[tool.coverage.run]
branch = true
source = ["piddiplatsch"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.black]
target-version = [
  "py311"
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["piddiplatsch"]
skip_gitignore = true

# bump-my-version configuration
[tool.bumpversion]
current_version = "2.2.1"
commit = true
tag = true
tag_name = "v{new_version}"

[tool.bumpversion.files."pyproject.toml"]
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
