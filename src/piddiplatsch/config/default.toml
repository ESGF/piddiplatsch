#############################################
# Piddiplatsch Default Configuration
#
# Overview of sections:
# - consumer: message processing pipeline defaults
# - kafka: Kafka client settings (librdkafka options supported)
# - handles: named Handle server profiles (use overrides for secrets)
# - stac: harvest recovery endpoint and explicit remote version lookup
# - schema: validation strictness
# - logging: log level and destination
# - plugins.*: project-specific mapping options
# - lookup: dataset version lookup adapters (map uses its catalog snapshot)
# - catalog: local project catalogs maintained by harvest
# - batch: scheduled mapping thresholds and ready-batch publication
# - stats: logging and live-status settings
#
# Full reference defaults; for site setup, start with etc/esgf-example.toml.
# Apply site overrides in /etc/piddi/piddi.toml and local overrides in custom.toml.
#############################################

[consumer]
# Project plugins selected from the shared publication stream.
# Use multiple names or the string "all" to run every registered plugin.
projects = ["cmip6"]
topic = "CMIP6"
output_dir = "outputs"
# Split raw archives by UTC day and by this many events per file.
dump_max_events = 100000

[disk]
enabled = true
# Warn below 40 GiB; below 20 GiB, latch a stop for manual inspection.
# After freeing space, remove <output_dir>/.disk-space-stop and restart services.
warn_free_gib = 40
stop_free_gib = 20
check_interval_seconds = 10

[catalog]
# Harvest maintains one shared piddi.db with project-scoped catalog/work rows.
# Missing PATCH bases fetch current remote STAC state without reapplying the patch.
# Recovered items stay marked for remote refresh on later events and harvest startup.
# --no-catalog retains the previous raw-dump-only behavior.
enabled = true
backend = "sqlite"
# false: stop harvest on an unknown project without acknowledging its event.
# true: durably dump it to dump/unknown_projects_*.jsonl, count it as filtered,
# and continue without creating catalog or work rows for that project.
# Override for one run: --ignore-unknown-projects or --stop-on-unknown-projects.
ignore_unknown_projects = false
# Batch broker acknowledgements after durable local writes. Flush pending offsets
# on idle, shutdown, limits, and partition revocation. Set batch size 1 for
# per-message commits (slower on remote brokers).
kafka_commit_batch_size = 100
kafka_commit_interval_seconds = 1.0
# Link each dataset version to its nearest strictly older catalog item in map.
# Uses the local catalog index; disable per run with map --no-version-history.
version_history = true
# Default database: <consumer.output_dir>/piddi.db. Override its directory:
# directory = "/var/lib/piddi"

[batch]
# Per project: map when this many event snapshots are pending OR the oldest has
# waited max_wait_seconds. Harvest changes arriving during mapping stay pending.
trigger_items = 100
max_wait_seconds = 600
# Maximum work entries per immutable output batch; never split an entry's Handles.
max_items = 2000
# Ready batches publish immediately during the sync tick, in project order.
publish_workers = 4
publish_retries = 3
# Database cleanup is disabled by default. Set a positive number of days to
# expire published work; retain catalog records and summaries.
retention_days = 0
# Default: <consumer.output_dir>/batches. Must be shared by all worker invocations.
# directory = "/var/lib/piddi/batches"

[maintenance]
# Gzip completed batch JSONL and closed publication receipts. Ready/failed
# batches and receipts still needed by ready batches are retained unchanged.
compress_outputs = true
# Keep completed output forever by default. Set e.g. 30 to remove it after
# 30 days. This does not delete Kafka dumps, DB summaries, or pending work.
output_retention_days = 0

[logging]
# INFO shows progress summaries. Use -vv/--debug for per-record details.
level = "INFO"
# Set to an empty string to log to the terminal instead of a file.
# File logging also writes ERROR/CRITICAL messages to a sibling .error.log file.
file = "pid.log"

[kafka]
# Set site-specific brokers, group, and credentials in an override file.
"bootstrap.servers" = "localhost:39092"
"group.id" = "piddiplatsch-001"
# Harvest uses a separate .harvest group and overrides automatic commits/storage
# to acknowledge only durable catalog writes. Raw-only harvest inherits these settings.
# ESGF production authentication. Local test Kafka overrides the protocol to PLAINTEXT.
"security.protocol" = "SASL_SSL"
"sasl.mechanisms" = "PLAIN"
# Required for the authenticated ESGF connection: set these in your site/local
# override, keeping real credentials out of this packaged file.
# "client.id" = "YOUR_ESGF_RESOURCE"
# "sasl.username" = "YOUR_KAFKA_USERNAME"
# "sasl.password" = "YOUR_KAFKA_PASSWORD"
# If your broker uses a custom CA, also set:
# "ssl.ca.location" = "/path/to/ca.pem"
"auto.offset.reset" = "earliest"
"enable.auto.commit" = true

# Kafka-reported errors are fatal; the consumer exits instead of continuing.

# Best practice for higher availability in librdkafka clients prior to 1.7.
"session.timeout.ms" = 45000

# Note: dotted librdkafka keys are quoted to keep them as literal TOML keys.

[handles]
# Used when a project does not select a profile explicitly.
default = "mock"

[handles.defaults]
# Handle publication backend.
# Map prepares JSONL without publication. Publish/sync send prepared Handles
# through REST.
backend = "rest"
# Keep certificate verification enabled in production. Disable only for a
# deliberately trusted service using a self-signed certificate. When disabled,
# repeated urllib3 InsecureRequestWarning messages are suppressed.
verify_https = true
# Timeout in seconds for each Handle REST request.
timeout = 10

[handles.profiles.mock]
# Local mock Handle server. Profiles inherit [handles.defaults] and only need
# to define values that differ or are specific to the server.
server_url = "http://localhost:8000"
# Fallback prefix; [plugins.<name>].handle_prefix can override it while sharing
# this profile's service and credentials.
prefix = "21.TEST"
username = "300:21.TEST/testuser"
password = "testpass"

[stac]
# Shared STAC endpoint. Projects may override this under
# [plugins.<name>.stac] when their collection is hosted elsewhere.
base_url = "https://discovery.east.esgf.io"
timeout = 10  # seconds
# Default collection for explicit STAC version queries. Project overrides follow.
# Harvest recovery uses the incoming collection/item identity; map stays local.
collection = "cmip6"

[schema]
# Enforce strict schema validation; set false to be permissive.
strict_mode = true

# Project Handle profiles are optional. Every plugin inherits [handles].default.
# Uncomment `handle` in a plugin table to override it for that project.
[plugins.cmip6]
# Sync selection weight, 0-255. Zero disables sync; manual map/publish still work.
# Equal weights give equal chances at each batch boundary, not a fixed order.
priority = 100
# Mapping error limit; catalog harvest independently stops on any error.
# 0 and 1 stop on the first error; -1 allows unlimited errors.
max_errors = 1
# handle = "profile-name"
# Ignore source dataset PIDs and generate from the full STAC item ID (instance_id).
# File tracking IDs are preserved; file parent links use the generated dataset PID.
force_dataset_pid = false
# Base URL for landing pages used to construct dataset/file URLs.
landing_page_url = "https://handle-esgf.dkrz.de/lp"

# Limit the number of HAS_PARTS entries; -1 for unlimited.
max_parts = -1

# Asset keys excluded from HAS_PARTS generation (non-data assets, previews, etc.).
excluded_asset_keys = ["reference_file", "globus", "thumbnail", "quicklook"]

[plugins.cmip6.stac]
collection = "CMIP6"

[plugins.cmip7]
priority = 100
max_errors = 1
# handle = "profile-name"
force_dataset_pid = false
# CMIP7 currently shares the Handle output schema and STAC mapping workflow
# with CMIP6, while declaring its own source PID field names.
landing_page_url = "https://handle-esgf.dkrz.de/lp"
max_parts = -1
excluded_asset_keys = ["reference_file", "globus", "thumbnail", "quicklook"]

[plugins.cmip7.stac]
collection = "CMIP7"

[plugins.cordex-cmip6]
priority = 100
max_errors = 1
# handle = "profile-name"
force_dataset_pid = false
landing_page_url = "https://handle-esgf.dkrz.de/lp"
max_parts = -1
excluded_asset_keys = ["reference_file", "globus", "thumbnail", "quicklook"]

[plugins.cordex-cmip6.stac]
collection = "CORDEX-CMIP6"

[plugins.cmip6plus]
priority = 100
# Override mapping errors for this project without changing other projects.
# max_errors = 10000
max_errors = 1
# handle = "profile-name"
force_dataset_pid = false
landing_page_url = "https://handle-esgf.dkrz.de/lp"
max_parts = -1
excluded_asset_keys = ["reference_file", "globus", "thumbnail", "quicklook"]

[plugins.cmip6plus.stac]
collection = "CMIP6Plus"

[lookup]
# Dataset version lookup: local catalog by default; "stac" is an explicit alternative.
# This switch controls standalone lookup adapter calls only.
# Map uses its catalog snapshot; linking is enabled by [catalog].version_history.
backend = "catalog"
enabled = false

[stats]
# Log interval (seconds) for console/DB reporters.
interval_seconds = 30

# Message count threshold before logging a stats snapshot.
summary_interval = 10000

# Enable live heartbeats and rate samples in piddi.db's stats table.
# Each batch has a retained stats row with original full/patch event counts;
# prepared/published Handle counts include aliases.
# Batch summaries are committed with work-state transitions even if monitoring is off.
# Heartbeats use separate run rows and never contribute to batch totals.
enable_db = true

# Heartbeats are written even while Kafka is idle. A monitor considers an
# unfinished run stale after the second threshold.
heartbeat_interval_seconds = 5
sample_interval_seconds = 15
sample_retention_days = 30
stale_after_seconds = 15
