# Additional slide tools for the existing piddi environment.
# make install adds DeckTape via npm and its browser inside the same prefix.
# Do not use --prune: application dependencies must be retained.
name: piddi
channels:
  - conda-forge
dependencies:
  - quarto >=1.6,<2
  # Includes npm for the DeckTape PDF exporter installed by the talks Makefile.
  - nodejs >=22,<23
